<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Classify every task before starting</title>
  <desc id="d">Three tiers. A Bug gets a reserved number, a fix and a regression test. A fully specified Change Request is implemented directly with a review gate. Everything else is a Plan with a plan file before any code. Schema, auth, permissions, tenancy, money, dates and concurrency are always a Plan.</desc>
  <style>
    :root { --bg:#FAF9F5; --card:#FFFFFF; --line:#E2DED2; --ink:#141413; --muted:#6B6A64; --clay:#D97757; --clayfill:#F6E4DC; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#262624; --card:#30302E; --line:#4A4943; --ink:#F5F4EE; --muted:#A8A69E; --clay:#E08A6D; --clayfill:#4A3129; }
    }
    .serif { font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: -0.01em; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect x="0" y="0" width="960" height="420" rx="20" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="959" height="419" rx="20" fill="none" stroke="var(--line)"/>

  <text x="40" y="54" class="sans" font-size="13" letter-spacing="1.8" font-weight="600" fill="var(--clay)">CLASSIFY EVERY TASK BEFORE STARTING</text>
  <text x="40" y="80" class="sans" font-size="14" fill="var(--muted)">The amount of process matches how much is still undecided, not how big the change looks.</text>

  <g class="sans">
    <rect x="40" y="104" width="280" height="200" rx="12" fill="var(--card)" stroke="var(--line)"/>
    <text x="62" y="136" class="mono" font-size="13" fill="var(--clay)">BUG-N</text>
    <text x="62" y="166" class="serif" font-size="24" fill="var(--ink)">Bug</text>
    <text x="62" y="192" font-size="13" fill="var(--muted)">Behavior violates the spec</text>
    <line x1="62" y1="210" x2="298" y2="210" stroke="var(--line)"/>
    <text x="62" y="234" font-size="13" fill="var(--ink)">Reserve the number first</text>
    <text x="62" y="256" font-size="13" fill="var(--ink)">Fix the root cause</text>
    <text x="62" y="278" font-size="13" fill="var(--ink)">Add a regression test</text>

    <rect x="340" y="104" width="280" height="200" rx="12" fill="var(--card)" stroke="var(--line)"/>
    <text x="362" y="136" class="mono" font-size="13" fill="var(--clay)">CR-N</text>
    <text x="362" y="166" class="serif" font-size="24" fill="var(--ink)">Change Request</text>
    <text x="362" y="192" font-size="13" fill="var(--muted)">Every detail already decided</text>
    <line x1="362" y1="210" x2="598" y2="210" stroke="var(--line)"/>
    <text x="362" y="234" font-size="13" fill="var(--ink)">Tracker row, no plan file</text>
    <text x="362" y="256" font-size="13" fill="var(--ink)">Implement directly</text>
    <text x="362" y="278" font-size="13" fill="var(--ink)">Review gate before ship</text>

    <rect x="640" y="104" width="280" height="200" rx="12" fill="var(--clayfill)" stroke="var(--clay)"/>
    <text x="662" y="136" class="mono" font-size="13" fill="var(--clay)">Plan N</text>
    <text x="662" y="166" class="serif" font-size="24" fill="var(--ink)">Plan</text>
    <text x="662" y="192" font-size="13" fill="var(--ink)">Anything still undecided</text>
    <line x1="662" y1="210" x2="898" y2="210" stroke="var(--clay)" stroke-opacity="0.4"/>
    <text x="662" y="234" font-size="13" fill="var(--ink)">Plan file before any code</text>
    <text x="662" y="256" font-size="13" fill="var(--ink)">Invariant table for risky rows</text>
    <text x="662" y="278" font-size="13" fill="var(--ink)">Checkbox verification</text>
  </g>

  <g class="sans">
    <rect x="40" y="324" width="880" height="60" rx="12" fill="none" stroke="var(--clay)" stroke-dasharray="5 5"/>
    <text x="62" y="351" font-size="14" font-weight="600" fill="var(--ink)">Always a Plan, however simple it looks:</text>
    <text x="62" y="371" font-size="13" fill="var(--muted)">schema, auth, permissions, tenant isolation, money, dates, recurrence, concurrency</text>
  </g>
</svg>
