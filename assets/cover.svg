<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Claude Code Playbook: guards over reminders</title>
  <desc id="d">A terminal running preflight, where the plan-drift guard fails and blocks the ship because a verification item is still unchecked.</desc>
  <style>
    :root { --bg:#FAF9F5; --card:#F0EEE6; --line:#E2DED2; --ink:#141413; --muted:#6B6A64; --clay:#D97757; --term:#1F1E1D; --tink:#E8E6DC; --tmuted:#9A988F; --ok:#7FA36B; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#262624; --card:#30302E; --line:#45443F; --ink:#F5F4EE; --muted:#A8A69E; --clay:#E08A6D; --term:#141413; --tink:#E8E6DC; --tmuted:#8C8A82; --ok:#8DB27A; }
    }
    .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <rect x="0" y="0" width="1280" height="420" rx="24" fill="var(--bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="24" fill="none" stroke="var(--line)"/>

  <text x="64" y="92" class="sans" font-size="14" letter-spacing="2.2" font-weight="600" fill="var(--clay)">CLAUDE CODE PLAYBOOK</text>
  <text x="64" y="168" class="serif" font-size="58" fill="var(--ink)">Guards over reminders.</text>
  <text x="64" y="214" class="sans" font-size="20" fill="var(--muted)">How a small team shipped a production financial</text>
  <text x="64" y="242" class="sans" font-size="20" fill="var(--muted)">platform with Claude Code, without trusting memory.</text>

  <g class="sans">
    <text x="64" y="330" class="serif" font-size="34" fill="var(--ink)">956</text>
    <text x="64" y="354" font-size="13" fill="var(--muted)">commits</text>
    <text x="194" y="330" class="serif" font-size="34" fill="var(--ink)">209</text>
    <text x="194" y="354" font-size="13" fill="var(--muted)">planned phases</text>
    <text x="344" y="330" class="serif" font-size="34" fill="var(--ink)">80</text>
    <text x="344" y="354" font-size="13" fill="var(--muted)">lessons logged</text>
    <text x="490" y="330" class="serif" font-size="34" fill="var(--ink)">30</text>
    <text x="490" y="354" font-size="13" fill="var(--muted)">guard tests</text>
  </g>

  <g transform="translate(724 58)">
    <rect width="496" height="304" rx="14" fill="var(--term)"/>
    <circle cx="22" cy="22" r="5" fill="#5A5953"/>
    <circle cx="40" cy="22" r="5" fill="#5A5953"/>
    <circle cx="58" cy="22" r="5" fill="#5A5953"/>
    <g class="mono" font-size="15">
      <text x="24" y="66" fill="var(--tmuted)">$ <tspan fill="var(--tink)">pnpm preflight</tspan></text>
      <text x="24" y="98" fill="var(--ok)">✓ <tspan fill="var(--tink)">lint</tspan></text>
      <text x="24" y="122" fill="var(--ok)">✓ <tspan fill="var(--tink)">typecheck</tspan></text>
      <text x="24" y="146" fill="var(--ok)">✓ <tspan fill="var(--tink)">schema-drift</tspan></text>
      <text x="24" y="170" fill="var(--clay)">✗ <tspan fill="var(--tink)">plan-drift</tspan></text>
      <text x="44" y="196" font-size="13" fill="var(--tmuted)">phase 186 is Completed but 1 Verification</text>
      <text x="44" y="216" font-size="13" fill="var(--tmuted)">item is still unchecked:</text>
      <text x="44" y="236" font-size="13" fill="var(--tink)">"stepper shows the new milestone"</text>
      <text x="24" y="276" fill="var(--clay)">Ship blocked.</text>
    </g>
  </g>
</svg>
